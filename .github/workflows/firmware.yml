name: firmware

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (calendar, time zones)
        run: make -C test/host
      - name: Differential test against recurring-ical-events
        run: |
          pip install recurring-ical-events radicale
          make -C test/host ics_dump caldav_live
          python3 test/host/diff_test.py 300
      - name: CalDAV end-to-end test (local Radicale server)
        run: python3 test/host/caldav_e2e.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: Build with the example configuration
        run: |
          cp include/config.example.h include/config.h
          pio run -e core2
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-core2
          path: .pio/build/core2/firmware.bin
