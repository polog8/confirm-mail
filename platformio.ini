; M5Stack Core2 desk station — https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = core2

[env:core2]
platform = espressif32@6.9.0
board = m5stack-core2
framework = arduino
board_build.partitions = default_16MB.csv
board_build.f_flash = 80000000L
board_build.embed_files = data/cert/x509_crt_bundle.bin
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -O2
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=2
  -Wall
lib_deps =
  m5stack/M5GFX@0.2.32
  m5stack/M5Unified@0.2.25
  bblanchon/ArduinoJson@7.4.3

; Mise à jour par Wi-Fi (définir kOtaPassword dans include/config.h) :
;   pio run -e core2-ota -t upload
[env:core2-ota]
extends = env:core2
upload_protocol = espota
upload_port = deskstation.local
upload_flags = --auth=${sysenv.DESK_OTA_PASSWORD}
